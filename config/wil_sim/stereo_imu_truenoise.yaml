%YAML:1.0

# ---------------------------------------------------------------------------
# MEASURED-IMU-NOISE TREATMENT (mean of the four recordings).
# Generated 2026-11-13 from vins_fusion_ros2/config/wil_sim/stereo_imu.yaml.
#
# Identical to that file except the four IMU noise parameters, which are the
# noise model the EKF "measured noise (diag.)" arm of table 4.3 was given,
# averaged over the four realistic recordings.  Source models:
#   output/compare/simulation/exp1-realistic/noise/<bag>/sensor_noise.yaml
# consumed by output/output_ekf_measured/simulation/<bag>/.
#
# The four bags were calibrated separately and do not agree:
#   bag                      gyro density z      accel density x
#   realistic_000             3.4891e-04                1.6245e-02
#   realistic_001             3.5509e-04                1.5140e-02
#   realistic_002             3.1123e-04                1.8029e-02
#   realistic_003             3.5133e-04                2.4489e-02
#   mean                     3.4164e-04                1.8476e-02
# One config cannot carry four, so this file holds the mean and the per-recording
# files stereo_imu_truenoise_realistic_000..003.yaml hold the exact models.  Use
# THOSE when the point is parity with table 4.3, each paired with its OWN bag;
# use this one when a single config must serve all four.  Its accel is up to
# 25 % off realistic_003.
#
# WHY THESE FILES EXIST.  stereo_imu.yaml inflates the IMU noise ~5x, per the
# usual VINS advice.  Experiment 1's EKF baseline is run twice: once on that same
# inflated model ("EKF, VSLAM-config noise") and once on a model measured from
# the recording ("EKF, measured noise (diag.)").  Table 4.3 reports both, and the
# measured-noise filter is far the more accurate.  That leaves an uncontrolled
# variable in the estimator comparison -- the filter may win because it is better
# informed about its sensors, not because dead reckoning is better.  This file
# hands VINS-Fusion the same numbers, changing one factor and nothing else.  The
# ORB-SLAM3 counterparts are orbslam3_ros2/config/wil_sim/stereo_imu_truenoise*;
# the key names differ but the quantities are identical, acc_n == IMU.NoiseAcc,
# gyr_n == IMU.NoiseGyro, gyr_w == IMU.GyroWalk, acc_w == IMU.AccWalk.
#
# The filter stores a per-sample sigma and both estimators want a continuous
# density, so each is divided by sqrt(200) for the 200 Hz IMU.  The EKF uses the
# gyro z and accel x axes only, so those are the axes taken.
#
# READ BEFORE QUOTING A RESULT.  Accel x is the direction of travel and its
# static window is contaminated by real longitudinal motion.  The simulator
# injects 4.0e-3, every measured value is three to six times that, and all sit
# close to the inflated 2.0e-2 of the baseline.  So this treatment loosens the
# GYRO and barely moves the accelerometer.  It equalises what the estimators are
# told about their sensors; it is not the simulator's true noise.
#
# acc_w has no counterpart: the filter carries no accelerometer-bias random-walk
# state.  It keeps the value derived from the simulator model (6.0e-3 m/s^2 bias,
# tau 300 s -> sigma_b*sqrt(2/tau) = 4.89898e-4), the only non-arbitrary choice
# available, and is the one parameter here not taken from the EKF.
# ---------------------------------------------------------------------------

# STEREO + IMU (imu:1, num_of_cam:2). SIMULATED WiL rig, Gazebo Fortress.
#
# The sensors are defined in
#   aws-robomaker-small-warehouse-world/models/ackermann_robot/model.sdf
# and reach ROS through the ros_gz_bridge started by that package's
# launch/small_warehouse.launch.py. Bring the whole thing up with:
#   ros2 launch aws_robomaker_small_warehouse_world small_warehouse.launch.py
#
# This is the SIM twin of config/wil/stereo_imu.yaml. The tuning is carried over,
# but every number describing the hardware is different, because the simulated
# rig genuinely is a different rig:
#
#   - Cameras are ideal PINHOLE, not fisheye. Fortress ships no wide-angle camera
#     implementation, so the real rig's ~180 deg KANNALA_BRANDT lens cannot be
#     reproduced. Anything that depends on that FOV -- feature distribution at
#     the image edge, the KANNALA_BRANDT unprojection path -- is NOT exercised
#     here. Use recorded bags with config/wil/ for that.
#   - The IMU reports in ROS REP-103 axes (x-forward, y-left, z-up), where the
#     real RealSense reports x-right/y-down/z-forward. That is the whole reason
#     body_T_cam0 below is a rotation matrix rather than the near-identity one in
#     config/wil/stereo_imu.yaml.
#   - Simulated gravity is exactly 9.8 and the accelerometer has no scale error,
#     so the g_norm workaround in config/wil/ does not apply.
#
# Sim advantages worth using: the extrinsics are exact (estimate_extrinsic:0),
# there is no camera/IMU time offset (estimate_td:0), and Gazebo publishes
# ground-truth odometry to check the trajectory against.
imu: 1
num_of_cam: 2

# Bridged straight through from gz. No image_transport republish step is needed
# here -- unlike the real rig, gz publishes raw images, not CompressedImage.
imu_topic: "/imu"
image0_topic: "/cam0/image_raw"
image1_topic: "/cam1/image_raw"

output_path: "/home/ambushee/output/wil_sim_stereo_imu/"   # absolute: "~" is NOT expanded by ofstream

cam0_calib: "cam0_pinhole.yaml"
cam1_calib: "cam1_pinhole.yaml"
image_width: 1280
image_height: 720

use_gpu: 0
use_gpu_acc_flow: 0
use_gpu_ceres: 0

# Extrinsics.
#
# The body frame is the IMU frame. In sim both the IMU pose and the camera poses
# are exact model geometry, so these matrices are computed, not calibrated, and
# estimate_extrinsic is 0 -- there is nothing to refine and letting VINS
# re-optimize would only add noise.
#
# ROTATION. imu_link carries no rotation relative to base_link, so the body frame
# is REP-103 (x-forward, y-left, z-up) and the cameras are REP-104 optical
# (x-right, y-down, z-forward). That gives the fixed
#   body_R_cam = [[0,0,1],[-1,0,0],[0,-1,0]]
# for both cameras -- the same matrix as config/carla/carla_stereo_imu.yaml,
# which faces the identical situation.
#
# TRANSLATION. Camera origin minus IMU origin, in the body frame. From the
# base_footprint-relative poses in model.sdf:
#   imu_link  (0.338,  0,      0.192)
#   cam0      (0.496,  0.0936, 0.4395)
#   cam1      (0.496,  0,      0.4395)
# giving (0.158, 0.0936, 0.2475) and (0.158, 0, 0.2475). Note this is a real
# 0.25 m lever arm, so unlike config/wil/'s zeroed placeholder it correctly
# accounts for angular rate coupling into measured acceleration during turns.
#
# CAM1 IS THE CENTRED CAMERA. It sits on the robot centreline (body y = 0) and
# cam0 is the offset one, one baseline to its left (body +Y). That is why cam0's
# y is positive here and cam1's is zero -- it is not a typo, and it is the
# opposite of the naive "cam0 is the reference so cam0 is centred" layout.
#
# The 0.0936 m baseline is the real rig's calibrated 93.598 mm, reused verbatim
# so sim and hardware geometry agree.
#
# If stereo geometry ever looks wrong, check the stereo RELATIVE rather than
# either column on its own -- that is the quantity VINS actually triangulates
# with, and it is invariant to where the pair sits on the chassis:
#   cam0_T_cam1 = inv(body_T_cam0) * body_T_cam1  ->  +0.0936 on cam0's optical X
# Positive optical X means cam1 is the RIGHT camera, matching the hardware
# calibration in config/wil/camera1_rot_trans.dat. Cross-check by eye: in
# rqt_image_view the cam1 image should be shifted LEFT relative to cam0.
estimate_extrinsic: 0

body_T_cam0: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ 0,  0,  1,  0.158,
          -1,  0,  0,  0.0936,
           0, -1,  0,  0.2475,
           0,  0,  0,  1]

body_T_cam1: !!opencv-matrix
   rows: 4
   cols: 4
   dt: d
   data: [ 0,  0,  1,  0.158,
          -1,  0,  0,  0.0,
           0, -1,  0,  0.2475,
           0,  0,  0,  1]

# Feature tracker
multiple_thread: 1
image_skip: 1            # every frame -> deterministic (default 2 causes a frame-skip race)
max_cnt: 150
min_dist: 30
freq: 25
F_threshold: 1.0
show_track: 1
flow_back: 1

# Optimization. Same as config/wil/: IMU pre-integration bridges the gap between
# keyframes, so keyframes can be sparser without losing the motion in between.
max_solver_time: 0.08
max_num_iterations: 100
keyframe_parallax: 10.0

# IMU noise. Unlike the real rig these have a known ground truth: model.sdf
# declares the sensor with the standard ADIS16448 densities,
#   gyro  0.0003394 rad/s/sqrt(Hz),  random walk 3.8785e-05
#   accel 0.004     m/s^2/sqrt(Hz),  random walk 0.006
# (expressed there as per-sample stddev, i.e. density * sqrt(200 Hz)).
# Set a few times looser than truth, per the usual VINS advice -- too-large noise
# degrades gracefully toward stereo-only, too-small does not.
# MEASURED values, mean of the four EKF noise models (see the header).
# Baseline (stereo_imu.yaml), kept for reference:
# acc_n: 0.02             # accelerometer measurement noise density  [m/s^2/sqrt(Hz)]
# gyr_n: 0.002            # gyroscope measurement noise density      [rad/s/sqrt(Hz)]
# acc_w: 0.001            # accelerometer bias random walk           [m/s^3/sqrt(Hz)]
# gyr_w: 0.0001           # gyroscope bias random walk               [rad/s^2/sqrt(Hz)]
acc_n: 0.018475671    # accelerometer measurement noise density  [m/s^2/sqrt(Hz)]
gyr_n: 0.000341640    # gyroscope measurement noise density      [rad/s/sqrt(Hz)]
acc_w: 0.000489898     # accelerometer bias random walk           [m/s^3/sqrt(Hz)]
gyr_w: 0.00001000    # gyroscope bias random walk               [rad/s^2/sqrt(Hz)]

# Exactly the worlds' <gravity>0 0 -9.8</gravity>. The simulated accelerometer
# has no scale error, so this is true gravity and not the observed-magnitude
# workaround config/wil/stereo_imu.yaml has to use.
g_norm: 9.8

# Off, and correctly so: the gz camera and IMU sensors are both stamped from the
# same simulation clock, so there is no offset to estimate. Leaving it on would
# have VINS chase a parameter whose true value is zero.
estimate_td: 0
td: 0.0

load_previous_pose_graph: 0
pose_graph_save_path: "/home/ambushee/output/wil_sim_stereo_imu/pose_graph/"
save_image: 1
