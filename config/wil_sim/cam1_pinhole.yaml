%YAML:1.0
---
# Gazebo Fortress camera sensor "cam1" -- cam0's stereo partner, 93.6 mm to its
# right. See cam0_pinhole.yaml for where the numbers come from.
#
# Identical to cam0 on purpose, and legitimately so: both sensors are declared
# with the same <image> and <horizontal_fov> in model.sdf, and a simulated
# pinhole has no manufacturing spread to distinguish them. (Contrast
# config/wil/cam1_fisheye.yaml, where reusing cam0's intrinsics is a stopgap for
# a missing second calibration.)
model_type: PINHOLE
camera_name: cam1
image_width: 1280
image_height: 720
distortion_parameters:
   k1: 0.0
   k2: 0.0
   p1: 0.0
   p2: 0.0
projection_parameters:
   fx: 640.0
   fy: 640.0
   cx: 640.0
   cy: 360.0
