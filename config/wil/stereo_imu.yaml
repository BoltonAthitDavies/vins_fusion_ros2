# Feature tracker
multiple_thread: 1

# Mask tracker features beyond this field angle of cam0 (degrees). THE SINGLE MOST
# IMPORTANT VALUE IN THIS FILE for the real rig -- see the block at the top. It lives here
# rather than in the launch command because on 2026-11-17 a run launched without the
# command-line argument diverged exactly as the pre-fix runs did. The ROS parameter of the
# same name still overrides this, including with 0 to switch the mask off deliberately.
# 70 deg keeps 65 % of the frame; the angle has ONE data point and is not swept.
fov_mask_deg: 70.0
# image_skip: process 1 of every N stereo pairs in the BACKEND (the front end still tracks
# every pair). The comment here used to read "every frame -> deterministic" while the value
# was 2, which is self-contradictory -- it was copied from config/wil_sim/ where the value
# really is 1. Measured on dataset_realv7_001, 2026-11-17, everything else as in this file:
#   image_skip 2 -> 1147 pairs received, 1134 processed, backend queue wait  7.6 ms mean /  207 ms max, ATE 0.733 m
#   image_skip 1 ->  971 pairs received,  971 processed, backend queue wait 18.5 ms mean /  511 ms max, ATE 0.713 m
# The ATE difference is inside VINS's own 3-7 % run-to-run spread, but at 1 the backend
# cannot keep up on this laptop and 15 % FEWER pairs reach the node at all -- the image
# callback falls behind and frames are lost before the tracker sees them, nondeterministically.
# Staying at 2 buys determinism and costs nothing measurable. Revisit on faster hardware.
image_skip: 2
max_cnt: 150
min_dist: 30
freq: 20
F_threshold: 1.0
show_track: 1
flow_back: 1

# Optimization.
# keyframe_parallax raised from stereo.yaml's 5.0: IMU pre-integration bridges the gap
# between keyframes, so keyframes can be sparser without losing the motion in between.
max_solver_time: 0.08
max_num_iterations: 100
keyframe_parallax: 10.0

# IMU noise. These set how strongly the optimizer trusts the IMU against visual
# reprojection, and they are live now that imu:1.
# Values taken from this repo's own config/realsense_d435i/realsense_stereo_imu_config.yaml
# rather than stereo.yaml's Bosch BNO055 figures, which were ~68x too tight for a
# RealSense (acc_n 0.00147 vs 0.1) and would have made the optimizer badly over-trust
# an IMU that is currently 5.6% out on scale.
# TODO: re-derive properly with an Allan variance plot from several hours of stationary
# logging (imu_utils / allan_variance_ros). Until then these are deliberately loose --
# too-large noise degrades gracefully toward stereo-only, too-small does not.
# 2026-11-03: acc_n / gyr_n INFLATED x10 to match ORB-SLAM3's real-rig setting (IMU.NoiseAcc 1.0,
# IMU.NoiseGyro 0.1). On dataset_realv6_000 the previous values made ORB-SLAM3's inertial fusion run
# away in most runs (1.1-9.6 m) while stereo-only tracked at 0.63 m; with x10 three consecutive ORB
# runs scored 0.47-0.49 m. This IMU's camera-relative axis signs, lever arm and time offset are
# unverified, so the optimizer must not over-trust it. Random walks unchanged. Previous values:
# 2026-11-17: the x10 inflation is REVERTED. It was a workaround for ORB-SLAM3's runaway,
# and ORB's runaway had a different cause; VINS never needed it. Measured on
# dataset_realv7_001 with everything else at the settings in this file: x10 gives 0.733 m
# ATE, these values give 0.686 m, with RPE(1 s) 0.090 m either way. Random walks unchanged
# (never A/B'd). PREVIOUS values: acc_n 1.0 / gyr_n 0.1.
# TODO still open: derive all four from an Allan variance plot of several hours stationary.
acc_n: 0.1              # accelerometer measurement noise density  [m/s^2/sqrt(Hz)]
gyr_n: 0.01             # gyroscope measurement noise density      [rad/s/sqrt(Hz)]
acc_w: 0.001            # accelerometer bias random walk           [m/s^3/sqrt(Hz)]
gyr_w: 0.0001           # gyroscope bias random walk               [rad/s^2/sqrt(Hz)]

# NOT the true local gravity (~9.81). This is the magnitude the accelerometer actually
# reports at rest, 9.2642 m/s^2, measured over the stationary window of the 2026-08-14
# bag. VINS uses g_norm as a fixed constraint when it refines gravity during
# initialization; feeding it 9.81 while the sensor insists on 9.264 makes that step
# inconsistent and is a good way to get a failed or badly-scaled init.
# This is a WORKAROUND for the uncalibrated accelerometer, not a fix -- the 5.6% scale
# error still corrupts dynamic accelerations, where bias estimation only partly absorbs
# it. Run rs-imu-calibration.py, then set this back to 9.81007.
